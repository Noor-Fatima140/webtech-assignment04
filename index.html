<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Slide Presentation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-file-powerpoint text-indigo-400 text-2xl"></i>
            <h1 class="text-xl font-bold text-white">Markdown Slide Presentation</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="saveBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold flex items-center space-x-2 transition shadow">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save (Ctrl+S)</span>
            </button>
            <span id="saveStatus" class="text-xs text-slate-400 hidden italic">Saved!</span>
        </div>
    </header>

    <!-- Main 2-Section Layout -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-4">
        
        <!-- Section 1: Markdown Code Editor -->
        <section class="flex-1 flex flex-col bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
            <div class="bg-slate-700/50 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-code text-indigo-400"></i> Section 1: Code Editor
                </span>
                <span class="text-xs text-slate-400">Use <code class="bg-slate-900 px-1 py-0.5 rounded text-amber-300">---</code> for new slide</span>
            </div>
            <textarea id="markdownInput" class="flex-1 bg-slate-900 text-slate-100 p-4 font-mono text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed" placeholder="Write markdown here..."></textarea>
        </section>

        <!-- Section 2: Realtime Slide View -->
        <section id="slidePreviewContainer" class="flex-1 flex flex-col bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl relative">
            <div class="bg-slate-700/50 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-desktop text-emerald-400"></i> Section 2: Realtime View
                </span>
            </div>

            <!-- Slide Display Area -->
            <div id="slideDisplayArea" class="flex-1 bg-white text-slate-900 p-8 sm:p-12 overflow-y-auto flex flex-col justify-center shadow-inner relative transition-all duration-300">
                <div id="slideContent" class="slide-content max-w-3xl mx-auto w-full"></div>
            </div>

            <!-- Bottom Controls & Counter -->
            <div id="slideControlBar" class="bg-slate-800 border-t border-slate-700 px-6 py-3 flex items-center justify-between">
                <!-- Left Button -->
                <button id="leftBtn" class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Left</span>
                </button>

                <!-- Slide Counter: {current slide number} / {total number of slides} -->
                <div class="text-sm font-bold text-slate-200 tracking-widest bg-slate-900 px-4 py-1.5 rounded-full border border-slate-700">
                    <span id="currentSlideNum">1</span> / <span id="totalSlidesNum">1</span>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- Right Button -->
                    <button id="rightBtn" class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow">
                        <span>Right</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <!-- Full Screen Button -->
                    <button id="fullScreenBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow border border-slate-600">
                        <i id="fullScreenIcon" class="fa-solid fa-expand"></i>
                        <span id="fullScreenText">Full Screen</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
